[package]
name = "crumbs-file-search"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false
# tests/index_tests.rs is a unit-test module with access to index internals.
autotests = false

[lib]
crate-type = ["staticlib"]

[dependencies]
core-foundation = "0.10"
ignore = "0.4"
libc = "0.2"
notify = "6.1"
nucleo-matcher = "0.3"
serde_json = "1"
